<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t">
<style>
  text{font:13px "Helvetica Neue",Arial,sans-serif;fill:#111}
  .t{font-size:16px;font-weight:700}
  .s{font-size:11px;fill:#444}
  .w{stroke:#111;stroke-width:1.6;fill:none}
  .b{stroke:#111;stroke-width:1.2;fill:#fff}
  .iso{stroke:#b00;stroke-width:1.5;stroke-dasharray:7 5;fill:none}
  .pin{fill:#111}
  .gnd{stroke:#111;stroke-width:1.6}
</style>
<rect width="1000" height="400" fill="#fff"/>

<title id="t">Verdrahtung eines 5-V-Relaismoduls mit Optokoppler am Pi ohne Interface</title>
<text class="t" x="20" y="30">Ohne Interface: 5-V-Relaismodul (Optokoppler, active-low) richtig am Pi</text>

<rect class="b" x="20" y="60" width="200" height="260" rx="6"/>
<text class="t" x="30" y="85">Pi 40-pol. Header</text>
<circle class="pin" cx="200" cy="110" r="4"/><text x="30" y="114">Pin 1 · +3,3 V</text>
<circle class="pin" cx="200" cy="150" r="4"/><text x="30" y="154">Pin 2 · +5 V</text>
<text class="s" x="30" y="168">bleibt frei</text>
<circle class="pin" cx="200" cy="190" r="4"/><text x="30" y="194">Pin 6 · GND</text>
<circle class="pin" cx="200" cy="230" r="4"/><text x="30" y="234">Pin 11 · GPIO 17</text>
<text class="s" x="30" y="248">open-drain (UI: Pegel = LOW)</text>
<circle class="pin" cx="200" cy="280" r="4"/><text x="30" y="284">Pin 13 · GPIO 27</text>

<rect class="b" x="440" y="60" width="240" height="260" rx="6"/>
<text class="t" x="450" y="85">Relaismodul 2/4/8-fach</text>
<circle class="pin" cx="440" cy="110" r="4"/><text x="452" y="114">VCC (Optokoppler-Seite)</text>
<circle class="pin" cx="440" cy="150" r="4"/><text x="452" y="154">JD-VCC (Relaisspulen)</text>
<text class="s" x="452" y="168">Jumper VCC–JD-VCC entfernen</text>
<circle class="pin" cx="440" cy="190" r="4"/><text x="452" y="194">GND</text>
<circle class="pin" cx="440" cy="230" r="4"/><text x="452" y="234">IN1</text>
<circle class="pin" cx="440" cy="280" r="4"/><text x="452" y="284">IN2</text>
<text x="590" y="205">K1</text>
<text x="624" y="224" text-anchor="end">NO</text><circle class="pin" cx="680" cy="220" r="4"/>
<text x="624" y="254" text-anchor="end">COM</text><circle class="pin" cx="680" cy="250" r="4"/>
<text x="624" y="284" text-anchor="end">NC</text><circle class="pin" cx="680" cy="280" r="4"/>
<path class="w" d="M630 220 H676 M630 250 H676 M630 280 H676" stroke-dasharray="2 3"/>

<path class="w" d="M200 110 H440"/>
<text class="s" x="230" y="104">3,3 V → LED-Ruhestrom 0 mA</text>
<path class="w" d="M200 190 H440"/>
<path class="w" d="M200 230 H440"/>
<path class="w" d="M200 280 H440"/>
<rect class="b" x="290" y="135" width="110" height="30" rx="4"/>
<text class="s" x="298" y="154">5 V ≥ 1 A, extern</text>
<path class="w" d="M400 150 H440"/>
<path class="w" d="M345 165 V190" />
<text class="s" x="230" y="182">8 Spulen ≈ 0,6 A: nicht aus dem Pi</text>

<path class="w" d="M680 220 H780 V200 H840"/>
<path class="w" d="M680 250 H780 V270 H840"/>
<rect class="b" x="840" y="180" width="140" height="110" rx="6"/>
<text x="850" y="205">CCU Tally IN</text>
<text class="s" x="850" y="222">(Kontakt-Modus) oder</text>
<text x="850" y="245">12-V-Lampe</text>
<text class="s" x="850" y="262">mit eigenem Netzteil</text>
<text class="s" x="850" y="278">Kontakt max. 30 V / 1 A</text>

<text x="20" y="350">VCC an 3,3 V, JD-VCC an externe 5 V, Jumper raus: der Pi liefert keinen Strom ins Modul, die Spulen zehren nicht am Pi.</text>
<text x="20" y="370">Bleibt: Pi-GND und Modul-GND sind eins. Für CCU, Beltpack und Mischer im selben Aufbau ist das Interface (eingang.svg, ausgang.svg) der Weg.</text>
<text x="20" y="390">Mechanisches Relais: ca. 10 ms Schaltzeit, hörbar, endliche Lebensdauer. Für Tally reicht es.</text>

</svg>
