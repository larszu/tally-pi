name: syntax

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python services
        run: python -m compileall -q *.py
      - name: Check shell scripts
        run: for f in *.sh; do bash -n "$f"; done
